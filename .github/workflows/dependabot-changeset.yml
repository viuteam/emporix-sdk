name: Dependabot Changeset

# Dependabot cannot author a changeset, and `changeset-check.yml` fails any PR
# that touches a package without one — so every npm security PR arrives red on a
# gate it can never satisfy. This adds an EMPTY changeset, which `changeset
# status` accepts and which releases nothing:
#
#   without         -> error Some packages have been changed but no changesets were found
#   with `---\n---` -> NO packages to be bumped at patch/minor/major, exit 0
#
# An empty changeset rather than a skipped gate on purpose: it shows up in the PR
# diff, so a reviewer who sees a *runtime* dependency bump (only `jiti`, in
# @viu/emporix-mixins) can replace it with a real `patch` entry instead of the
# bump shipping unreleased and unremarked.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changeset:
    name: add empty changeset
    # Only Dependabot's own PRs. `github.actor` is set by GitHub, not by the PR,
    # so this cannot be spoofed from a branch name or a commit.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `pull_request_target` is required, not a shortcut: a `pull_request` run
      # triggered by Dependabot gets a read-only token and NO access to secrets,
      # so it could neither mint the app token nor push.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # NOTHING IS CHECKED OUT. The first version of this workflow did
      # `actions/checkout` on the PR head and CodeQL flagged it
      # `actions/untrusted-checkout/high` — a privileged token in a tree the PR
      # controls, where `git commit` alone can run repo hooks. The file is created
      # through the contents API instead, so no PR content ever reaches the runner.
      #
      # The app token, not GITHUB_TOKEN: a commit made with GITHUB_TOKEN does not
      # trigger downstream workflows, which would leave the `changeset` check
      # sitting on its old failure forever. Same reason api-sync.yml uses it.
      - name: Add an empty changeset unless one is already there
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILE=".changeset/dependabot-${PR_NUMBER}.md"

          # A human may have added a real changeset, or a previous run of this
          # workflow may have added the empty one — `synchronize` fires again on
          # every force-push Dependabot makes. Either way, leave the PR alone.
          if gh pr view "$PR_NUMBER" --json files --jq '.files[].path' \
             | grep -qE '^\.changeset/.+\.md$'; then
            echo "PR already carries a changeset — nothing to do."
            exit 0
          fi

          # base64 of "---\n---\n" — an empty changeset: valid front matter, no
          # packages listed, so `changeset status` passes and `version` bumps
          # nothing. Hardcoded because the content is fixed; verified byte-wise.
          gh api --method PUT "repos/${REPO}/contents/${FILE}" \
            -f message="chore(deps): add an empty changeset for the dependabot bump" \
            -f content="LS0tCi0tLQo=" \
            -f branch="${HEAD_REF}"
