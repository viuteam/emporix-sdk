name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint a short-lived GitHub App token so the release PR that
      # changesets/action opens is attributed to the app (not GITHUB_TOKEN).
      # Events from GITHUB_TOKEN never trigger other workflows, which left the
      # required pr-check / changeset checks stuck on "Expected".
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Persist the app token so the version-bump push (synchronize event)
          # is attributed to the app and triggers downstream checks.
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Build first: examples typecheck against the built @viu/emporix-sdk
      # package interface (dist + .d.ts), so dist must exist before typecheck.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Action v2 requires Changesets CLI v3 and renamed every input we pass
      # (publish/version/commit/title -> *-script / commit-message / pr-title).
      # Unknown inputs are only a warning, so a half-migrated step would run
      # with NO publish or version script and still look green — keep these
      # names and the CLI major in lockstep.
      #
      # Do not wrap `version-script` in `|| true`: CLI v3 made
      # `changeset version` exit 1 when nothing is pending (v2 only warned),
      # but the action calls version-script only when changesets exist, so that
      # path is unreachable here. Tolerating a non-zero exit would hide a real
      # version failure instead.
      - uses: changesets/action@v2
        with:
          # `pnpm run` is required: `pnpm version`/`pnpm publish` are pnpm
          # built-ins that would otherwise shadow our package.json scripts.
          publish-script: pnpm run release
          version-script: pnpm run version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
