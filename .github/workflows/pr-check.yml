name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads code, writes nothing. Without an explicit block the token carries the
    # repository default, which may be read-write.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Angular 22 declares engines.node ^22.22.3 || ^24.15.0 || >=26.0.0, so
        # `pnpm install` emits EBADENGINE on the 20 row. .npmrc sets no
        # engine-strict, so it warns rather than fails, and tsc and vitest do not
        # care — packages/angular's unit tests pass on Node 20. The Angular CLI
        # is the exception: it checks the version itself and refuses to run, so
        # the AOT build step below is skipped on 20 rather than expected to pass.
        # The row stays because the other five packages support Node 20.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples typecheck against the built dist/ of @viu/emporix-sdk and
      # @viu/emporix-sdk-react. Build first so typecheck has the artifacts.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      # esbuild silently drops "use client" directives — guard that the react
      # client entries keep their banner and ssr stays server-importable.
      - name: Check react dist "use client" banners
        run: pnpm -F @viu/emporix-sdk-react check:dist

      # Same guard for next: catalog-client must keep its banner, the server
      # entries must not gain one. The script also fails loudly when an entry
      # is renamed and the list is not — which is how it earned this step.
      - name: Check next dist "use client" banners
        run: pnpm -F @viu/emporix-sdk-next check:dist

      # packages/angular is built with tsup rather than ng-packagr because it
      # exports only functions and holds no decorators. Assert that stayed true:
      # a decorator in the artifact breaks a consumer's AOT build, not ours.
      - name: Check angular dist has no Angular compiler output
        run: pnpm -F @viu/emporix-sdk-angular check:dist

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The decorator guard above only matters if a real AOT production build
      # accepts the artifact. This is the step that would catch that breaking.
      # Skipped on Node 20: the Angular CLI enforces its own engine requirement
      # and exits before building (see the matrix comment).
      - name: Build the angular example with AOT
        if: matrix.node != '20'
        run: pnpm -F @viu/emporix-examples-angular exec ng build --configuration production
