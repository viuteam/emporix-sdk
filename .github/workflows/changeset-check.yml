name: Changeset Check
on:
  pull_request:
    # The `no-release` gate reads the event payload, and `gh pr create --label`
    # attaches labels after `opened`, so label changes need runs of their own.
    types: [opened, synchronize, reopened, labeled, unlabeled]
# The newest event wins: a `labeled` run cancels an `opened` run still in
# flight, whose failure would otherwise land after the skip on the same commit.
# Per workflow, not per job: the run that skips the job must still cancel.
concurrency:
  group: changeset-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changeset:
    name: changeset
    runs-on: ubuntu-latest
    # Reads code and the PR's labels, which arrive in the event payload rather
    # than through the API. Nothing here is written.
    permissions:
      contents: read
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The changesets release PR consumes all changesets, so it legitimately
      # has none. Skip the gate there instead of failing every release PR.
      - name: Changeset status (skip on release PR)
        run: |
          if [ "${{ github.head_ref }}" = "changeset-release/main" ]; then
            echo "Release PR — no changesets expected, skipping."
            exit 0
          fi
          pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref }}
